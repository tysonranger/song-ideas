<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Song Ideas</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Song Ideas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1917" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<style>
:root{
  --bg:#F7F4EF; --card:#FFFFFF; --line:#E7E2DA; --text:#1C1917; --muted:#57534E;
  --chip:#EFEAE3; --chip-text:#1C1917; --accent:#B45309; --accent-text:#FFFFFF;
  --accent-soft:#FDF1E3; --rec:#DC2626; --sheet:#FFFFFF; --scrim:rgba(28,25,23,.45);
  --field:#F7F4EF; --dash:#A8A29E;
  --note:#2563EB; --note-bg:#E3EDFF; --note-text:#172F6B;
  --take:#C2410C; --take-bg:#FDE8D2; --take-text:#6B2309;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#1C1917; --card:#292524; --line:#3A3532; --text:#F5F5F4; --muted:#B6AFA8;
    --chip:#3A3532; --chip-text:#F5F5F4; --accent:#F59E0B; --accent-text:#1C1917;
    --accent-soft:#3B2A12; --rec:#EF4444; --sheet:#292524; --scrim:rgba(0,0,0,.6);
    --field:#1C1917; --dash:#78716C;
    --note:#60A5FA; --note-bg:#1C3354; --note-text:#E2EDFF;
    --take:#FB923C; --take-bg:#4A2A12; --take-text:#FFE6CF;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:-apple-system,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(env(safe-area-inset-top) + 14px) 16px 8px}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.5px}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:8px;align-items:center}
.primary{height:44px;padding:0 16px;border:none;border-radius:22px;background:var(--accent);color:var(--accent-text);
  font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;flex-shrink:0}
.iconbtn{width:44px;height:44px;border-radius:22px;border:none;background:var(--chip);display:flex;align-items:center;justify-content:center}
.search{margin-top:10px;width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);
  color:var(--text);font-size:16px;padding:0 12px;outline:none}
.search::placeholder{color:var(--muted)}
.banner{margin:8px 12px 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:13px;
  display:flex;align-items:center;justify-content:space-between;gap:10px}
.banner button{border:none;background:none;color:var(--accent);font-weight:700;font-size:13px;padding:8px 4px}
.cols,.row{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.cols{display:none !important}
.cols{padding:8px 20px 6px;font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px;padding:0 10px 24px}
.row{padding:14px 14px 12px;background:var(--card);border-radius:14px;border:1px solid var(--line);align-items:start}
.row.fresh{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.title{border:none;background:none;padding:0;text-align:left;font-size:18px;font-weight:700;line-height:1.22;letter-spacing:-.2px;
  word-break:break-word;min-height:0;display:block;width:100%}
.title.untitled{color:var(--muted);font-weight:500}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:600;letter-spacing:0}
.meta:empty{display:none}
.date{color:var(--muted);font-weight:400}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px}
.badge.bn{background:var(--note-bg);color:var(--note)}
.badge.bt{background:var(--take-bg);color:var(--take)}
.notes{display:flex;flex-direction:column;align-items:flex-start;gap:6px;min-width:0}
.notes:empty,.takes:empty{display:none}
.bubble{border:none;text-align:left;font-size:14px;line-height:1.38;background:var(--note-bg);color:var(--note-text);
  border-radius:14px 14px 14px 4px;padding:8px 11px;max-width:100%;white-space:pre-wrap;word-break:break-word}
/* typing right in the list */
.ed{display:block;width:100%;border:1.5px solid var(--accent);background:var(--field);color:var(--text);font:inherit;
  font-size:16px;line-height:1.38;border-radius:14px 14px 14px 4px;padding:7px 10px;resize:none;outline:none;overflow:hidden;min-height:40px}
.ed.edtitle{font-size:18px;font-weight:700;line-height:1.22;border-radius:12px}
.ed::placeholder{color:var(--muted);font-weight:400}
/* swipe left to delete */
.sw{position:relative;overflow:hidden;max-width:100%}
.sw.rowsw{border-radius:14px}
.sw.notesw{border-radius:14px 14px 14px 4px}
.sw.takesw{border-radius:20px}
.sw-body{position:relative;z-index:1;transition:transform .22s ease;touch-action:pan-y;width:100%}
.sw:not(.swiping):not(.open) > .sw-del{visibility:hidden}
.sw-del{position:absolute;top:0;right:0;bottom:0;border:none;background:#DC2626;color:#fff;font-weight:700;font-size:14px;
  display:flex;align-items:center;justify-content:flex-end;padding:0 18px;width:100%}
.sw.notesw .sw-del,.sw.takesw .sw-del{padding:0 12px}
.undo{position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:flex;align-items:center;
  justify-content:space-between;gap:12px;background:var(--text);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;font-size:15px;max-width:520px;margin:0 auto}
.undo button{border:none;background:transparent;color:var(--accent);font-weight:700;font-size:15px;padding:10px 14px;min-height:44px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.add,.rec{height:38px;padding:0 14px;border-radius:19px;background:transparent;font-size:14px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px}
.add{border:1.5px solid var(--note);color:var(--note)}
.takes{display:flex;flex-wrap:wrap;gap:6px}
.takes .takesw{width:auto}
.take{position:relative;overflow:hidden;height:40px;border:none;border-radius:20px;background:var(--take-bg);color:var(--take-text);
  font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 11px 0 10px;text-align:left;
  -webkit-touch-callout:none;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.take .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--take);opacity:.35;pointer-events:none}
.take span,.take svg{position:relative}
.take .lbl{display:flex;align-items:baseline;gap:5px;min-width:0;line-height:1.2}
.take .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.take .du{font-size:12px;font-weight:400;color:var(--take-text);opacity:.75;font-variant-numeric:tabular-nums}
.take svg{flex-shrink:0;color:var(--take)}
.rec{border:1.5px solid var(--take);color:var(--take)}
.empty{padding:48px 24px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet > *{flex-shrink:0}
.sheet{width:100%;max-width:560px;background:var(--sheet);border-radius:22px 22px 0 0;padding:10px 20px calc(20px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:14px;max-height:92vh;overflow:auto}
.scrim.attop{align-items:flex-start}
.scrim.attop .sheet{border-radius:0 0 22px 22px;padding:calc(14px + env(safe-area-inset-top)) 20px 18px}
.scrim.attop .grab{display:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet h2{margin:0;font-size:18px}
.sheet .hint{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.field{width:100%;border:1px solid var(--line);background:var(--field);color:var(--text);border-radius:12px;padding:12px;
  font-size:17px;font-family:inherit;outline:none;resize:none}
textarea.field{min-height:120px;line-height:1.4}
.btnrow{display:flex;gap:10px}
.btn{flex:1;height:48px;border-radius:14px;border:none;font-size:16px;font-weight:600;background:var(--chip)}
.btn.go{background:var(--accent);color:var(--accent-text)}
.btn.danger{background:transparent;color:var(--rec);border:1px solid var(--line)}
.menuitem{height:52px;border:none;border-radius:14px;background:var(--chip);font-size:16px;font-weight:600;text-align:left;padding:0 16px;
  display:flex;align-items:center;justify-content:space-between}
.menuitem small{font-weight:400;color:var(--muted);font-size:13px}
/* menu */
.mhead{display:flex;align-items:center;justify-content:space-between;margin-top:-4px}
.mhead h2{font-size:22px}
.mdone{border:none;background:none;color:var(--accent);font-size:17px;font-weight:600;padding:10px 0 10px 16px;min-height:44px}
.mstatus{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;background:var(--chip)}
.mstatus > div{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.mstatus b{font-size:16px;font-weight:600}
.mstatus small{font-size:13px;color:var(--muted)}
.mdot{width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.mdot.ok{background:#16A34A}.mdot.wait{background:#D97706}.mdot.warn{background:#DC2626}.mdot.off{background:#78716C}
.mpill{border:none;background:var(--accent);color:var(--accent-text);font-size:14px;font-weight:600;height:34px;padding:0 14px;border-radius:17px;flex-shrink:0}
.mpill.quiet{background:transparent;color:var(--accent);padding:0 6px}
.mpath{margin:-6px 4px 0;font-size:12px;color:var(--muted)}
.mlabel{margin:4px 4px -8px;font-size:12px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.mgroup{border-radius:16px;background:var(--chip);overflow:hidden}
.mgroup button{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:none;background:none;padding:0 14px;font-size:16px;text-align:left;position:relative}
.mgroup button + button::before{content:"";position:absolute;top:0;left:56px;right:0;border-top:1px solid var(--line)}
.mgroup button:active{background:var(--line)}
.mgroup .mtx{flex:1}
.mgroup small{font-size:14px;color:var(--muted)}
.mgroup .chev{color:var(--dash);flex-shrink:0}
.mic{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.mred{justify-content:center;color:var(--rec)}
.mred .mtx{flex:none;font-weight:500}
.mtip{margin:0;text-align:center;font-size:12px;color:var(--muted)}
/* recorder */
.recfor{text-align:center;font-size:13px;color:var(--muted)}
.recfor b{display:block;font-size:18px;color:var(--text);margin-top:2px;word-break:break-word}
.clock{display:flex;align-items:center;justify-content:center;gap:10px;font-size:44px;font-weight:300;font-variant-numeric:tabular-nums}
.dot{width:12px;height:12px;border-radius:6px;background:var(--rec);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.meter{height:64px;display:flex;align-items:center;justify-content:center;gap:3px}
.meter i{display:block;width:4px;border-radius:2px;background:var(--accent);height:6px;transition:height .08s}
.recbtns{display:flex;align-items:center;justify-content:center;gap:40px}
.cancel{width:56px;height:56px;border-radius:28px;border:none;background:var(--chip);display:flex;align-items:center;justify-content:center}
.stop{width:84px;height:84px;border-radius:42px;border:4px solid #FECACA;background:var(--rec);display:flex;align-items:center;justify-content:center}
.stop span{width:28px;height:28px;border-radius:6px;background:#fff}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:40;
  background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;max-width:90vw;text-align:center}
.hidden{display:none !important}
body.typing .list{padding-bottom:60vh}
</style>
</head>
<body>
<header class="top">
  <div class="toprow">
    <div>
      <h1>Song Ideas</h1>
      <div class="sub" id="count">Works with no signal</div>
    </div>
    <div class="actions">
      <button class="iconbtn" id="menuBtn" aria-label="Menu">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><circle cx="4" cy="10" r="2" fill="currentColor"/><circle cx="10" cy="10" r="2" fill="currentColor"/><circle cx="16" cy="10" r="2" fill="currentColor"/></svg>
      </button>
      <button class="primary" id="newBtn">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>
        New idea
      </button>
    </div>
  </div>
  <input class="search hidden" id="search" type="search" placeholder="Search ideas and notes" aria-label="Search ideas and notes">
</header>
<div id="banner"></div>
<div class="cols" id="cols"><span>Idea</span><span>Description</span></div>
<main class="list" id="list"></main>
<div id="layer"></div>

<script>
'use strict';
/* ---------- storage (IndexedDB) ---------- */
const DB_NAME = 'song-ideas', DB_VER = 1;
let dbp = null;
function db(){
  if (dbp) return dbp;
  dbp = new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAME, DB_VER);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains('ideas')) d.createObjectStore('ideas', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('audio')) d.createObjectStore('audio', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta', { keyPath: 'k' });
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbp;
}
async function tx(store, mode, fn){
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, mode);
    const s = t.objectStore(store);
    let out;
    const r = fn(s);
    if (r) r.onsuccess = () => { out = r.result; };
    t.oncomplete = () => res(out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
}
const getAll = (s) => tx(s, 'readonly', (st) => st.getAll());
const get = (s, k) => tx(s, 'readonly', (st) => st.get(k));
const put = (s, v) => tx(s, 'readwrite', (st) => st.put(v));
const del = (s, k) => tx(s, 'readwrite', (st) => st.delete(k));

let persistAsked = false;
async function askPersist(){
  if (persistAsked) return; persistAsked = true;
  try { if (navigator.storage && navigator.storage.persist) await navigator.storage.persist(); } catch (e) {}
}

/* ---------- state ---------- */
let ideas = [];
let query = '';
let freshId = null;
let lastBackup = null;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

async function load(){
  ideas = await getAll('ideas');
  const m = await get('meta', 'lastBackup');
  lastBackup = m ? m.v : null;
  const d = await get('meta', 'dbx');
  dbx = d ? d.v : null;
  const o = await get('meta', 'ops');
  dbxOps = o ? o.v : [];
  await assignFileDates();
  await renameToTracks();
  render();
}
// Ideas imported from Apple Notes have no real date. Their Dropbox folders get a placeholder
// shaped like a date but clearly not one: 0000-00-001 for the oldest up to 0000-00-153 for the
// newest. Sorted by name they sit after every real-dated folder and keep the app's order.
// Set once and kept, so names never shift.
const isStandIn = (s) => /^0000-00-\d{3}$/.test(s || '');
async function assignFileDates(){
  const todo = ideas.filter((i) => i.noDate && !isStandIn(i.fileDate)).sort((a, b) => a.at - b.at);
  if (!todo.length) return;
  let n = Math.max(0, ...ideas.filter((i) => isStandIn(i.fileDate)).map((i) => Number(i.fileDate.slice(8))));
  for (const idea of todo){ idea.fileDate = '0000-00-' + String(++n).padStart(3, '0'); await put('ideas', idea); }
}
async function saveIdea(idea){
  idea.upd = Date.now();
  await put('ideas', idea);
  const i = ideas.findIndex((x) => x.id === idea.id);
  if (i >= 0) ideas[i] = idea; else ideas.push(idea);
  askPersist();
  scheduleSync();
}

/* ---------- helpers ---------- */
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const fmtDur = (s) => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
const fmtDate = (t) => new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: new Date(t).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
const $ = (id) => document.getElementById(id);
function toast(msg){
  const t = document.createElement('div');
  t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2600);
}
const PLUS = '<svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg>';
const PLAY = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.5v9l7.5-4.5z" fill="currentColor"/></svg>';
const PAUSE = '<svg width="11" height="11" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="1.5" width="3" height="9" fill="currentColor"/><rect x="7" y="1.5" width="3" height="9" fill="currentColor"/></svg>';

/* ---------- render ---------- */
function matches(idea){
  if (!query) return true;
  const q = query.toLowerCase();
  return (idea.title || '').toLowerCase().includes(q) || idea.notes.some((n) => n.text.toLowerCase().includes(q));
}
const TRASH = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>';
const noteHTML = (n) => `<div class="sw notesw" data-swipe="note" data-note="${n.id}"><button class="sw-del" data-del aria-label="Delete note">${TRASH}</button><button class="bubble sw-body" data-act="note" data-note="${n.id}">${esc(n.text)}</button></div>`;
const NOTE_IC = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h9"/></svg>';
const MIC_IC = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
const metaHTML = (idea) => (idea.noDate ? '' : `<span class="date">${fmtDate(idea.at)}</span>`);
const titleHTML = (idea) => `<button class="title${idea.title ? '' : ' untitled'}" data-act="title">${esc(idea.title || 'Untitled idea')}<span class="meta">${metaHTML(idea)}</span></button>`;
function refreshMeta(idea){
  const m = document.querySelector(`.row[data-id="${idea.id}"] .tcell .meta`);
  if (m) m.innerHTML = metaHTML(idea);
}
function rowHTML(idea){
  return `
    <div class="sw rowsw" data-swipe="idea" data-id="${idea.id}"><button class="sw-del" data-del>Delete</button>
    <section class="row sw-body${idea.id === freshId ? ' fresh' : ''}" data-id="${idea.id}">
      <div class="tcell">${titleHTML(idea)}</div>
      <div class="notes">${idea.notes.map(noteHTML).join('')}</div>
      <div class="takes">${idea.takes.map((t) => `<div class="sw takesw" data-swipe="take" data-take="${t.id}"><button class="sw-del" data-del aria-label="Delete recording">${TRASH}</button><button class="take sw-body" data-act="take" data-take="${t.id}" aria-label="Play ${esc(t.name)}"><span class="fill"></span>${playing && playing.id === t.id ? PAUSE : PLAY}<span class="lbl"><span class="nm">${esc(t.name)}</span><span class="du">${fmtDur(t.dur)}</span></span></button></div>`).join('')}</div>
      <div class="acts"><button class="add" data-act="addnote">${PLUS} Note</button><button class="rec" data-act="record">${PLUS} Record</button></div>
    </section></div>`;
}
function render(){
  const list = $('list');
  $('count').textContent = countText();
  renderBanner();
  if (editing || (swipe && swipe.on)){ needRender = true; return; } // never rebuild the list under someone's typing or swiping
  needRender = false; openSw = null;
  const sorted = ideas.slice().sort((a, b) => b.at - a.at);
  const shown = sorted.filter(matches);
  if (draft && !query) shown.unshift(draft);
  $('search').classList.toggle('hidden', ideas.length < 6 && !query);
  $('cols').classList.toggle('hidden', !shown.length);
  if (!ideas.length && !draft){
    list.innerHTML = '<div class="empty">No ideas yet.<br>Tap <b>New idea</b> to add your first one.</div>';
    return;
  }

    return;

}
function renderBanner(){
  const b = $('banner');

}
function countText(){
  const n = ideas.length ? `${ideas.length} idea${ideas.length === 1 ? '' : 's'}` : 'Works with no signal';
  if (!dbx || !dbx.refresh || dbx.broken) return ideas.length ? n + ' · works with no signal' : n;

/* ---------- actions: typing right in the list ---------- */
let editing = null, needRender = false, draft = null, lastDown = null;
const findIdea = (id) => ideas.find((x) => x.id === id) || (draft && draft.id === id ? draft : null);
const elFrom = (html) => { const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; };
function grow(ta){ ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 3) + 'px'; }
// Tapping any button while typing saves what was typed first, then does what was tapped.
document.addEventListener('pointerdown', (e) => {
  lastDown = e.target;
  if (editing && !editing.ta.contains(e.target) && e.target.closest('button, input')) finishEdit(editing);
}, true);

function newIdea(){
  if (editing) finishEdit(editing);
  closeSwipe();
  query = ''; $('search').value = '';
  const now = Date.now();
  draft = { id: uid(), title: '', notes: [], takes: [], at: now, upd: now };
  freshId = draft.id;
  render();
  const y = window.scrollY;
  if (y){ window.scrollTo(0, 0); slideFrom(-y); }
  beginEdit('title', draft);
}
function beginEdit(kind, idea, noteId){
  if (editing) finishEdit(editing);
  closeSwipe();
  const row = document.querySelector(`.row[data-id="${idea.id}"]`); if (!row) return;
  const ta = document.createElement('textarea');
  ta.className = 'ed' + (kind === 'title' ? ' edtitle' : '');
  ta.rows = 1;
  ta.setAttribute('autocomplete', 'off');
  ta.setAttribute('autocapitalize', 'sentences');
  ta.setAttribute('enterkeyhint', kind === 'note' || (kind === 'title' && idea !== draft) ? 'done' : 'next');
  if (kind === 'title'){
    const cell = row.querySelector('.tcell');
    ta.value = idea.title || ''; ta.placeholder = 'Name the idea';
    cell.innerHTML = ''; cell.appendChild(ta);
  } else if (kind === 'note'){
    const n = idea.notes.find((x) => x.id === noteId); if (!n) return;
    ta.value = n.text; ta.placeholder = 'Type a note';
    row.querySelector(`.sw[data-note="${noteId}"]`).replaceWith(ta);
  } else {
    ta.placeholder = 'Type a note';
    row.querySelector('.notes').appendChild(ta);
  }
  const ed = editing = { kind, idea, noteId, ta, row, done: false };
  ta.addEventListener('input', () => grow(ta));
  ta.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); finishEdit(ed, { next: true }); }
    else if (e.key === 'Escape'){ e.preventDefault(); finishEdit(ed, { cancel: true }); }
  });
  ta.addEventListener('blur', () => finishEdit(ed));
  grow(ta);
  document.body.classList.add('typing');
  placeForTyping(ta);
  focusBox(ed);
}
function finishEdit(ed, opts = {}){
  if (!ed || ed.done) return;
  ed.done = true;
  if (editing === ed) editing = null;
  const { kind, idea, ta, row } = ed;
  const v = opts.cancel ? null : ta.value.trim();
  let then = null;
  if (kind === 'title'){
    const cell = ta.parentNode;
    if (idea === draft){
      // A brand-new idea is kept once it has a name, or when a button in its row was tapped (e.g. + Record).
      const keep = v || (v !== null && !opts.next && lastDown && row.contains(lastDown) && !ta.contains(lastDown));
      draft = null;
      if (!keep){ const sw = row.closest('.sw'); if (sw) sw.remove(); if (!ideas.length) needRender = true; if (!editing) document.body.classList.remove('typing'); return afterEdit(); }
      idea.title = v; idea.at = idea.upd = Date.now();
      ideas.push(idea); saveIdea(idea);
      if (opts.next) then = () => beginEdit('addnote', idea);
    } else if (v !== null && v !== idea.title){ idea.title = v; saveIdea(idea); }
    if (cell) cell.innerHTML = titleHTML(idea);
  } else if (kind === 'note'){
    const i = idea.notes.findIndex((x) => x.id === ed.noteId), n = idea.notes[i];
    if (!n) ta.remove();
    else if (v === null){ ta.replaceWith(elFrom(noteHTML(n))); }
    else if (!v){ ta.remove(); deleteNote(idea, n.id); }
    else { if (v !== n.text){ n.text = v; saveIdea(idea); } ta.replaceWith(elFrom(noteHTML(n))); }
  } else {
    if (v){
      const n = { id: uid(), text: v, at: Date.now() };
      idea.notes.push(n); freshId = idea.id; saveIdea(idea);
      const y0 = ta.getBoundingClientRect().top;
      ta.before(elFrom(noteHTML(n)));
      if (opts.next){
        window.scrollBy(0, ta.getBoundingClientRect().top - y0); // keep the same box open for the next bullet, so the keyboard stays up
        ta.value = ''; grow(ta); ed.done = false; editing = ed; refreshMeta(idea); return;
      }
    }
    const add = row.querySelector('[data-act=addnote]');
    ta.remove(); if (add) add.classList.remove('hidden');
  }
  if (kind !== 'title') refreshMeta(idea);
  $('count').textContent = countText();
  if (!editing) document.body.classList.remove('typing');

}
// Before the keyboard opens, move the box up into the top half of the screen (just under the top bar),

function placeForTyping(el){

  const vTop = vv ? vv.offsetTop : 0, vBottom = vv ? vv.offsetTop + vv.height : window.innerHeight;
  const header = document.querySelector('.top').getBoundingClientRect().bottom;
  const want = Math.max(header, vTop) + 10;
  const limit = Math.min(window.innerHeight * 0.5, vBottom - 40);
  const r = el.getBoundingClientRect();
  if (r.top >= want && r.bottom <= limit) return;
  window.scrollBy(0, r.top - want);
  slideFrom(r.top - el.getBoundingClientRect().top);
}
// The page has already jumped to its new spot; draw it where it was and glide it there,
// timed with the keyboard sliding up, so your eyes can follow it.
let slideUntil = 0;
function slideFrom(shift){
  if (Math.abs(shift) < 2) return;
  const lim = window.innerHeight * 0.6;
  shift = Math.max(-lim, Math.min(lim, shift));
  const els = [$('banner'), $('cols'), $('list')];
  els.forEach((e) => { e.style.transition = 'none'; e.style.transform = `translateY(${shift}px)`; });
  void document.body.offsetHeight;
  els.forEach((e) => { e.style.transition = 'transform .55s cubic-bezier(.4,0,.2,1)'; e.style.transform = ''; });
  slideUntil = Date.now() + 560;
  setTimeout(() => els.forEach((e) => { e.style.transition = ''; }), 600);
}
// While the page glides, an invisible box near the top holds the keyboard open, so the iPhone
// doesn't try to scroll on its own. The real box takes over as soon as the glide ends.
let kbd = null;
function keyboardHolder(){
  if (!kbd){
    kbd = document.createElement('input');
    kbd.type = 'text'; kbd.tabIndex = -1;
    kbd.setAttribute('autocomplete', 'off'); kbd.setAttribute('autocapitalize', 'sentences'); kbd.setAttribute('aria-hidden', 'true');
    kbd.style.cssText = 'position:fixed;top:12px;left:0;width:2px;height:2px;opacity:0;font-size:16px;border:0;padding:0;margin:0;pointer-events:none';
    document.body.appendChild(kbd);
  }

}
function focusBox(ed){
  const ta = ed.ta;
  const put = () => {
    clearTimeout(ed.handoff); ed.handoff = 0;
    if (kbd){ kbd.oninput = kbd.onkeydown = null; }
    if (editing !== ed || !ta.isConnected){ if (kbd && document.activeElement === kbd) kbd.blur(); return false; }
    if (kbd && kbd.value){ ta.value += kbd.value; kbd.value = ''; grow(ta); }
    ta.focus({ preventScroll: true });
    try { ta.setSelectionRange(ta.value.length, ta.value.length); } catch (e) {}
    return true;
  };
  const wait = slideUntil - Date.now();
  if (wait <= 0) return put();
  const k = keyboardHolder();
  k.value = '';
  k.focus({ preventScroll: true });
  k.oninput = () => put();
  k.onkeydown = (e) => { if (e.key === 'Enter'){ e.preventDefault(); if (put()) finishEdit(ed, { next: true }); } else put(); };

}
function afterEdit(){ setTimeout(() => { if (!editing && needRender) render(); }, 700); }

/* ---------- delete, with Undo ---------- */
let pendingDel = null;
function offerUndo(msg, undo, commit){
  flushUndo();
  const bar = document.createElement('div');
  bar.className = 'undo'; bar.innerHTML = `<span>${esc(msg)}</span><button type="button">Undo</button>`;
  document.body.appendChild(bar);
  const p = pendingDel = { bar, commit, timer: setTimeout(flushUndo, 6000) };
  bar.querySelector('button').onclick = () => {
    if (pendingDel !== p) return;
    clearTimeout(p.timer); bar.remove(); pendingDel = null; undo();
  };
}
function flushUndo(){
  const p = pendingDel; if (!p) return;
  pendingDel = null; clearTimeout(p.timer); p.bar.remove();
  Promise.resolve(p.commit()).catch(() => {});
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushUndo(); });
window.addEventListener('pagehide', flushUndo);

function deleteIdea(idea){
  if (editing && editing.idea === idea){ editing.done = true; editing = null; }
  if (playing && idea.takes.some((t) => t.id === playing.id)) stopPlayback();
  if (idea === draft){ draft = null; render(); return; }
  ideas = ideas.filter((x) => x !== idea);
  render();
  // Nothing is really removed (here or in Dropbox) until the Undo has gone away.
  offerUndo(`Deleted “${idea.title || 'Untitled idea'}”`, () => { if (!ideas.includes(idea)) ideas.push(idea); render(); }, async () => {
    for (const t of idea.takes) await del('audio', t.id);
    await del('ideas', idea.id);
    if (idea.sync && idea.sync.folder) await queueOp({ op: 'delete', path: DBX_ROOT + '/' + idea.sync.folder });
    $('count').textContent = countText();
    scheduleSync();
  });
}
function deleteNote(idea, noteId){
  const i = idea.notes.findIndex((x) => x.id === noteId); if (i < 0) return;
  const [n] = idea.notes.splice(i, 1);
  saveIdea(idea); refreshMeta(idea);
  offerUndo('Note deleted', () => { idea.notes.splice(Math.min(i, idea.notes.length), 0, n); saveIdea(idea); render(); }, () => {});
}
function deleteTake(idea, takeId){
  const i = idea.takes.findIndex((x) => x.id === takeId); if (i < 0) return;
  if (playing && playing.id === takeId) stopPlayback();
  const [t] = idea.takes.splice(i, 1);
  saveIdea(idea); refreshMeta(idea);
  offerUndo(`${t.name} deleted`, () => { idea.takes.splice(Math.min(i, idea.takes.length), 0, t); saveIdea(idea); render(); }, () => del('audio', t.id));
}
function takeMenu(idea, takeId){
  const t = idea.takes.find((x) => x.id === takeId); if (!t) return;
  openSheet(`<h2>${esc(t.name)}</h2><p class="hint">${fmtDur(t.dur)} · recorded ${new Date(t.at).toLocaleString()}</p>
    <button class="menuitem" id="mren">Rename</button>
    <button class="menuitem" id="mshare">Share or save the audio</button>
    <button class="btn danger" id="mdel">Delete recording</button>
    <button class="btn" id="mclose">Close</button>`, () => {
    $('mclose').onclick = closeSheet;
    $('mren').onclick = () => textSheet({ title: 'Rename recording', value: t.name, onSave: async (v) => { if (v){ t.name = v; await saveIdea(idea); render(); } } });
    $('mshare').onclick = async () => { closeSheet(); await shareTake(idea, t); };
    $('mdel').onclick = () => { closeSheet(); deleteTake(idea, t.id); render(); };
  });
}
async function shareTake(idea, t){
  const a = await get('audio', t.id); if (!a) return toast('Recording not found');
  const ext = (a.type || '').includes('mp4') ? 'm4a' : (a.type || '').includes('ogg') ? 'ogg' : 'webm';
  const name = `${(idea.title || 'Song idea').replace(/[\\/:*?"<>|]/g, '')} - ${t.name}.${ext}`;
  const file = new File([a.blob], name, { type: a.type });
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file] }); } catch (e) {}
  } else downloadBlob(a.blob, name);
}
function downloadBlob(blob, name){
  const u = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 4000);
}

/* ---------- playback ---------- */
let playing = null; // { id, audio, url }
function stopPlayback(){
  if (!playing) return;
  try { playing.audio.pause(); } catch (e) {}
  URL.revokeObjectURL(playing.url);
  playing = null;
  render();
}
async function togglePlay(takeId){
  if (playing && playing.id === takeId){
    if (playing.audio.paused) playing.audio.play(); else playing.audio.pause();
    updateTakeIcon(); return;
  }
  stopPlayback();
  const a = await get('audio', takeId); if (!a) return toast('Recording not found');
  const url = URL.createObjectURL(a.blob);
  const audio = new Audio(url);
  playing = { id: takeId, audio, url };
  audio.addEventListener('timeupdate', () => {
    const el = document.querySelector(`.take[data-take="${takeId}"] .fill`);
    const total = isFinite(audio.duration) && audio.duration > 0 ? audio.duration : (findTake(takeId) || {}).dur || 1;
    if (el) el.style.width = Math.min(100, audio.currentTime / total * 100) + '%';
  });
  audio.addEventListener('ended', stopPlayback);
  audio.addEventListener('pause', updateTakeIcon);
  audio.addEventListener('play', updateTakeIcon);
  render();
  try { await audio.play(); } catch (e) { toast('Could not play this recording'); stopPlayback(); }
}
function findTake(id){ for (const i of ideas){ const t = i.takes.find((x) => x.id === id); if (t) return t; } return null; }
function updateTakeIcon(){
  if (!playing) return;
  const el = document.querySelector(`.take[data-take="${playing.id}"] svg`);
  if (el) el.outerHTML = playing.audio.paused ? PLAY : PAUSE;
}

/* ---------- recording ---------- */
let recState = null;
function pickMime(){
  if (!window.MediaRecorder) return null;
  for (const m of ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg']) if (MediaRecorder.isTypeSupported(m)) return m;
  return '';
}
function nextTrack(idea){
  const nums = idea.takes.map((t) => (/^Track (\d+)$/.exec(t.name) || [])[1]).filter(Boolean).map(Number);
  return nums.length ? Math.max(...nums) + 1 : idea.takes.length + 1;
}
// Recordings with an automatic name ("Take 3", "New Recording 5", from earlier versions or Apple Notes)
// become "Track 1", "Track 2"... in the order they were recorded. Names typed by hand are left alone.
async function renameToTracks(){
  const auto = /^(Take \d+|New Recording( \d+)?|Track \d+)$/;
  for (const idea of ideas){
    if (!idea.takes.length || !idea.takes.some((t) => /^(Take \d+|New Recording( \d+)?)$/.test(t.name))) continue;
    idea.takes.sort((a, b) => a.at - b.at);
    idea.takes.forEach((t, k) => { if (auto.test(t.name)) t.name = 'Track ' + (k + 1); });
    await put('ideas', idea);
  }
}
async function startRecording(idea){
  stopPlayback();
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || pickMime() === null){
    return toast('Recording isn’t supported here. Open the app from your home screen in Safari.');
  }
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } }); }
  catch (e) { return toast('Microphone is blocked. Allow it in Settings › Safari › Microphone.'); }
  const mime = pickMime();
  const rec = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  const chunks = [];
  const n = nextTrack(idea);
  recState = { idea, stream, rec, chunks, start: Date.now(), keep: true, raf: 0, ctx: null };
  rec.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = () => finishRecording();
  rec.start(1000);
  openSheet(`
    <div class="recfor">Recording for<b>${esc(idea.title || 'Untitled idea')}</b></div>
    <div class="clock"><span class="dot"></span><span id="clock">0:00</span></div>
    <div class="meter" id="meter" role="img" aria-label="Sound level">${'<i></i>'.repeat(36)}</div>
    <div class="recbtns">
      <button class="cancel" id="rcancel" aria-label="Cancel recording"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15"/></svg></button>
      <button class="stop" id="rstop" aria-label="Stop and save"><span></span></button>
      <span style="width:56px;height:56px"></span>
    </div>
    <p class="hint" style="text-align:center">Tap stop to save it as Track ${n}</p>`, () => {
    $('rstop').onclick = () => { recState.keep = true; rec.state !== 'inactive' && rec.stop(); };
    $('rcancel').onclick = () => { recState.keep = false; rec.state !== 'inactive' && rec.stop(); };
  });
  // level meter
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx(); recState.ctx = ctx;
    const src = ctx.createMediaStreamSource(stream);
    const an = ctx.createAnalyser(); an.fftSize = 256; src.connect(an);
    const buf = new Uint8Array(an.fftSize);
    const bars = Array.from(document.querySelectorAll('#meter i'));
    const levels = new Array(bars.length).fill(0);
    let last = 0;
    const tick = (ts) => {
      if (!recState) return;
      const c = $('clock'); if (c) c.textContent = fmtDur((Date.now() - recState.start) / 1000);
      if (ts - last > 70){
        last = ts;
        an.getByteTimeDomainData(buf);
        let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
        levels.shift(); levels.push(Math.min(1, peak / 64));
        bars.forEach((b, i) => { b.style.height = (6 + levels[i] * 54) + 'px'; });
      }
      recState.raf = requestAnimationFrame(tick);
    };
    recState.raf = requestAnimationFrame(tick);
  } catch (e) {
    const iv = setInterval(() => { if (!recState) return clearInterval(iv); const c = $('clock'); if (c) c.textContent = fmtDur((Date.now() - recState.start) / 1000); }, 250);
  }
}
async function finishRecording(){

  closeSheet();
  const dur = (Date.now() - s.start) / 1000;
  if (!s.keep || !s.chunks.length || dur < 0.5){ if (s.keep) toast('Nothing was recorded'); return; }
  const type = s.rec.mimeType || (s.chunks[0] && s.chunks[0].type) || 'audio/mp4';
  const blob = new Blob(s.chunks, { type });
  const id = uid();
  await put('audio', { id, blob, type });
  const idea = ideas.find((x) => x.id === s.idea.id) || s.idea;
  const next = nextTrack(idea);
  idea.takes.push({ id, name: 'Track ' + next, dur, at: Date.now(), ext: extFor(type) });
  freshId = idea.id;
  await saveIdea(idea);
  render();
  toast('Saved Track ' + next);

// if the phone locks or the app is left mid-recording, keep what was captured
document.addEventListener('visibilitychange', () => {
  if (document.hidden && recState && recState.rec.state !== 'inactive'){ recState.keep = true; recState.rec.stop(); }
});

function blobToB64(blob){

}

  for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type });
}
async function backup(){

  for (const a of audio) data.audio.push({ id: a.id, type: a.type, data: await blobToB64(a.blob) });
  const d = new Date();
  const name = `Song Ideas backup ${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}.json`;
  const file = new File([JSON.stringify(data)], name, { type: 'application/json' });
  let done = false;
  if (navigator.canShare && navigator.canShare({ files: [file] })){
    try { await navigator.share({ files: [file], title: name }); done = true; }
    catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (!done){ downloadBlob(file, name); done = true; }
  lastBackup = Date.now();
  await put('meta', { k: 'lastBackup', v: lastBackup });
  render();
}
function restore(){

  inp.style.cssText = 'position:fixed;left:-9999px;opacity:0';
  document.body.appendChild(inp); // iPhone only reports the chosen file for inputs that are on the page
  inp.addEventListener('cancel', () => inp.remove());
  inp.onchange = async () => {
    const f = inp.files && inp.files[0];
    inp.remove();
    if (!f) return;
    toast('Reading backup…');
    let data;
    try { data = JSON.parse(await f.text()); } catch (e) { return toast('That file isn’t a Song Ideas backup'); }
    if (!data || data.app !== 'song-ideas' || !Array.isArray(data.ideas)) return toast('That file isn’t a Song Ideas backup');
    confirmSheet('Restore this backup?', `It has ${data.ideas.length} idea${data.ideas.length === 1 ? '' : 's'}. Ideas already on this phone stay; matching ones are replaced with the backup’s version.`, 'Restore', async () => {
      for (const a of (data.audio || [])) await put('audio', { id: a.id, type: a.type, blob: b64ToBlob(a.data, a.type) });
      for (const i of data.ideas) await put('ideas', i);
      await load();
      toast('Backup restored');
      scheduleSync();
    });
  };

}

/* ---------- Dropbox sync ---------- */
// Each idea becomes a folder named after it, holding "Description.txt" and its recordings.
const DBX_KEY = 'n6bqbqt22k7kujb';
const DBX_ROOT = '/01 Music/Songwriting/Song Ideas';
const REDIRECT = location.origin + location.pathname.replace(/index\.html$/, '');
let dbx = null;        // { refresh, lastSync, broken }
let dbxOps = [];       // pending deletes for ideas that no longer exist
let access = null;     // { token, exp }
let syncing = false, syncAgain = false, syncTimer = 0;

const b64url = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function randomString(n){ const a = new Uint8Array(n); crypto.getRandomValues(a); return b64url(a).slice(0, n); }

async function dbxConnect(){
  closeSheet();
  if (!navigator.onLine) return toast('Connect Dropbox when you have signal');
  const verifier = randomString(64);
  const challenge = b64url(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)));
  const state = randomString(16);
  await put('meta', { k: 'pkce', v: { verifier, state } });
  const q = new URLSearchParams({ client_id: DBX_KEY, response_type: 'code', code_challenge: challenge, code_challenge_method: 'S256', token_access_type: 'offline', redirect_uri: REDIRECT, state });
  location.href = 'https://www.dropbox.com/oauth2/authorize?' + q.toString();
}
async function finishConnect(){
  const q = new URLSearchParams(location.search);
  if (!q.has('code') && !q.has('error')) return;
  history.replaceState(null, '', REDIRECT);
  if (q.has('error')) return toast('Dropbox wasn’t connected');
  const p = await get('meta', 'pkce');
  if (!p || p.v.state !== q.get('state')) return toast('Couldn’t finish connecting. Try Connect Dropbox again.');
  try {
    const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
      method: 'POST',
      body: new URLSearchParams({ code: q.get('code'), grant_type: 'authorization_code', client_id: DBX_KEY, code_verifier: p.v.verifier, redirect_uri: REDIRECT })
    });
    const j = await r.json();
    if (!r.ok || !j.refresh_token) throw new Error(j.error_description || 'no token');
    access = { token: j.access_token, exp: Date.now() + (j.expires_in || 14000) * 1000 };
    dbx = { refresh: j.refresh_token, lastSync: null };
    await put('meta', { k: 'dbx', v: dbx });
    await del('meta', 'pkce');
    toast('Dropbox connected');
    render();
    sync(true);
  } catch (e) { toast('Couldn’t connect Dropbox. Try again.'); }
}
async function token(){
  if (access && access.exp > Date.now() + 60000) return access.token;
  const r = await fetch('https://api.dropboxapi.com/oauth2/token', {
    method: 'POST', body: new URLSearchParams({ grant_type: 'refresh_token', refresh_token: dbx.refresh, client_id: DBX_KEY })
  });
  if (r.status === 400 || r.status === 401){
    dbx.broken = true; await put('meta', { k: 'dbx', v: dbx });
    throw Object.assign(new Error('signed out'), { fatal: true });
  }
  if (!r.ok) throw new Error('token ' + r.status);
  const j = await r.json();
  access = { token: j.access_token, exp: Date.now() + (j.expires_in || 14000) * 1000 };
  return access.token;
}
async function apiError(r){
  let summary = '';
  try { const j = await r.json(); summary = j.error_summary || ''; } catch (e) {}
  if (r.status === 401){ access = null; }
  return Object.assign(new Error('dropbox ' + r.status + ' ' + summary), { status: r.status, summary });
}
async function rpc(endpoint, body){
  const r = await fetch('https://api.dropboxapi.com/2/' + endpoint, {
    method: 'POST', headers: { Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  if (!r.ok) throw await apiError(r);
  return r.json();
}
const asciiJSON = (o) => JSON.stringify(o).replace(/[\u007f-￿]/g, (c) => '\\u' + ('000' + c.charCodeAt(0).toString(16)).slice(-4));
async function upload(path, blob){
  const r = await fetch('https://content.dropboxapi.com/2/files/upload', {
    method: 'POST',
    headers: { Authorization: 'Bearer ' + await token(), 'Content-Type': 'application/octet-stream', 'Dropbox-API-Arg': asciiJSON({ path, mode: 'overwrite', mute: true, autorename: false }) },
    body: blob
  });
  if (!r.ok) throw await apiError(r);
  return r.json();
}
const notFound = (e) => /not_found/.test(e.summary || '');
const conflict = (e) => /conflict/.test(e.summary || '');

function cleanName(s){
  return String(s || '').normalize('NFC').replace(/[\\/:*?"<>|\u0000-\u001f]/g, ' ').replace(/\s+/g, ' ').trim().replace(/[. ]+$/, '').slice(0, 120);
}
const ymd = (t) => { const d = new Date(t); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function folderNames(){
  // Same title twice gets " (2)", " (3)"... in the order the ideas were started.
  const used = new Map(), out = new Map();
  for (const i of ideas.slice().sort((a, b) => a.at - b.at)){
    const base = (i.fileDate || ymd(i.at)) + ' - ' + (cleanName(i.title) || 'Untitled idea');
    let name = base, n = 1;
    while (used.has(name.toLowerCase())) name = `${base} (${++n})`;
    used.set(name.toLowerCase(), 1); out.set(i.id, name);
  }
  return out;
}
function extFor(type){ type = type || ''; return type.includes('mp4') || type.includes('aac') ? '.m4a' : type.includes('ogg') ? '.ogg' : type.includes('webm') ? '.webm' : '.m4a'; }
function takeNames(idea){
  const used = new Set(), out = new Map();
  for (const t of idea.takes){
    const base = cleanName(t.name) || 'Track';
    const ext = t.ext || '.m4a';
    let name = base + ext, n = 1;
    while (used.has(name.toLowerCase())) name = `${base} (${++n})${ext}`;
    used.add(name.toLowerCase()); out.set(t.id, name);
  }
  return out;
}
function descText(idea){
  // Just the idea, then its notes as bullets.
  const lines = [idea.title || 'Untitled idea', ''];
  for (const n of idea.notes) lines.push('• ' + n.text.replace(/\n/g, '\n  '));
  if (!idea.notes.length) lines.push('(No notes)');
  return lines.join('\n') + '\n';
}
function needsSync(idea, names){
  const s = idea.sync;
  if (!s || !s.folder || s.wanted !== names.get(idea.id) || s.desc !== descText(idea)) return true;
  const tn = takeNames(idea);
  if (idea.takes.some((t) => s.takes[t.id] !== tn.get(t.id))) return true;
  return Object.keys(s.takes).some((id) => !idea.takes.find((t) => t.id === id));
}
function pendingCount(){
  if (!dbx) return 0;
  const names = folderNames();
  return ideas.filter((i) => needsSync(i, names)).length + dbxOps.length;
}
async function queueOp(op){ dbxOps.push(op); await put('meta', { k: 'ops', v: dbxOps }); }
function scheduleSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), 1500); }

async function syncIdea(idea, names){
  const live = () => ideas.includes(idea);
  const persist = async () => { if (live()) await put('ideas', idea); };
  const want = names.get(idea.id);
  const s = idea.sync = idea.sync || { folder: null, wanted: null, desc: null, takes: {} };
  // 1. the folder
  if (s.folder && s.wanted !== want){
    try {
      const r = await rpc('files/move_v2', { from_path: DBX_ROOT + '/' + s.folder, to_path: DBX_ROOT + '/' + want, autorename: true });
      s.folder = r.metadata.name; s.wanted = want;
    } catch (e) {
      if (!notFound(e)) throw e;
      // Old folder is gone. If one with the new name already exists (renamed elsewhere), adopt it as is.
      let adopted = false;
      try { const m = await rpc('files/get_metadata', { path: DBX_ROOT + '/' + want }); adopted = m['.tag'] === 'folder'; } catch (e2) { if (!notFound(e2)) throw e2; }
      if (adopted){ s.folder = want; s.wanted = want; }
      else { s.folder = null; s.desc = null; s.takes = {}; }
    }
    await persist();
  }
  if (!s.folder){
    try { await rpc('files/create_folder_v2', { path: DBX_ROOT + '/' + want, autorename: false }); }
    catch (e) { if (!conflict(e)) throw e; } // already there: use it
    s.folder = want; s.wanted = want;
    if (!live()){ await rpc('files/delete_v2', { path: DBX_ROOT + '/' + want }).catch(() => {}); return; }
    await persist();
  }
  const dir = DBX_ROOT + '/' + s.folder;
  // 2. the notes
  const text = descText(idea);
  if (s.desc !== text){
    await upload(dir + '/Description.txt', new Blob([text], { type: 'text/plain' }));
    s.desc = text; await persist();
  }
  // 3. recordings: add new ones, rename changed ones, remove deleted ones
  const tn = takeNames(idea);
  for (const t of idea.takes.slice()){
    const name = tn.get(t.id), cur = s.takes[t.id];
    if (cur === name) continue;
    if (cur){
      try { await rpc('files/move_v2', { from_path: dir + '/' + cur, to_path: dir + '/' + name, autorename: false }); s.takes[t.id] = name; await persist(); continue; }
      catch (e) { if (!notFound(e)) throw e; }
    }
    const a = await get('audio', t.id);
    if (!a) continue;
    await upload(dir + '/' + name, a.blob);
    s.takes[t.id] = name; await persist();
  }
  for (const id of Object.keys(s.takes)){
    if (idea.takes.find((t) => t.id === id)) continue;
    try { await rpc('files/delete_v2', { path: dir + '/' + s.takes[id] }); } catch (e) { if (!notFound(e)) throw e; }
    delete s.takes[id]; await persist();
  }
}
async function sync(manual){
  if (!dbx || !dbx.refresh || dbx.broken){ if (manual) toast('Connect Dropbox first'); return; }
  if (!navigator.onLine){ if (manual) toast('No signal. It’ll save to Dropbox when you’re back online.'); render(); return; }
  if (syncing){ syncAgain = true; return; }
  syncing = true; $('count').textContent = countText();
  let failed = null;
  try {
    while (dbxOps.length){
      const op = dbxOps[0];
      try { await rpc('files/delete_v2', { path: op.path }); } catch (e) { if (!notFound(e)) throw e; }
      dbxOps.shift(); await put('meta', { k: 'ops', v: dbxOps });
    }
    const names = folderNames();
    for (const idea of ideas.slice()){
      if (!needsSync(idea, names)) continue;
      try { await syncIdea(idea, names); }
      catch (e) { if (e.fatal) throw e; failed = e; }
    }
    if (!failed){ dbx.lastSync = Date.now(); await put('meta', { k: 'dbx', v: dbx }); }
  } catch (e) { failed = e; }
  syncing = false;
  if (failed && manual) toast(failed.fatal ? 'Dropbox needs you to sign in again' : 'Couldn’t reach Dropbox. It’ll try again.');
  if (manual && !failed) toast('Saved to Dropbox');
  render();
  if (syncAgain){ syncAgain = false; scheduleSync(); }
  else if (failed && !failed.fatal){ clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), 60000); }
}

let swipe = null, openSw = null, swipeEnd = 0;

function setX(sw, x, anim){

    return;
  }

  if (!s.on){

    if (dx > -10 || Math.abs(dx) < Math.abs(dy) * 1.3) return;

  const s = swipe; if (!s || e.pointerId !== s.id) return;

  swipeEnd = Date.now();
  const dx = e.clientX - s.x0, R = REVEAL[s.kind] || 60;
  const full = Math.min(s.w * 0.8, Math.max(s.w * 0.55, R + 70));
  if (e.type !== 'pointercancel' && dx <= -full){
    setX(s.sw, -s.w, true);
    setTimeout(() => swipeDelete(s.sw), 200);
  } else if (e.type !== 'pointercancel' && dx < -R / 2){
    setX(s.sw, -R, true); s.sw.classList.add('open'); openSw = s.sw;
  } else {
    setX(s.sw, 0, true);
    setTimeout(() => s.sw.classList.remove('swiping'), 230);

}

  const act = b.dataset.act;
  if (act === 'take'){ if (pressed){ pressed = false; return; } return togglePlay(b.dataset.take); }
  if (act === 'title') return beginEdit('title', idea);
  if (act === 'addnote') return beginEdit('addnote', idea);
  if (act === 'note') return beginEdit('note', idea, b.dataset.note);
  if (act === 'record') return startRecording(idea);
});

if ('serviceWorker' in navigator && location.protocol === 'https:'){
  navigator.serviceWorker.register('sw.js').catch(() => {});
  // When a new version has been downloaded and takes over, switch to it straight away
  // (but never while a note, name or recording is open, so nothing typed is lost).
  let reloading = false;
  const applyUpdate = () => {
    if (reloading) return;
    if (recState || $('layer').innerHTML || editing || draft || pendingDel || openSw){ setTimeout(applyUpdate, 2000); return; }
    reloading = true; location.reload();
  };
  if (navigator.serviceWorker.controller) navigator.serviceWorker.addEventListener('controllerchange', applyUpdate);
  // iPhone often just resumes the app instead of reopening it, so check for updates on every return.
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && navigator.onLine) navigator.serviceWorker.getRegistration().then((r) => r && r.update()).catch(() => {});
  });
}
load().then(finishConnect).then(() => sync()).catch(() => { $('list').innerHTML = '<div class="empty">Couldn’t open your saved ideas. Close the app and open it again.</div>'; });
</script>
